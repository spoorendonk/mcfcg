name: CI

# A weekly check-up, never a gate. Local CI -- pre-push, run under the machine
# lock -- is what lands a change; nothing waits on this workflow. Never add a
# push or pull_request trigger, or a schedule more often than weekly.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the pre-push hook enforces, re-checked weekly because a `--no-verify`
  # push or a clone whose hooks never ran skips the hook. It sees main's tip
  # only, so a receipt-less commit that a later reviewed push buried goes
  # unnoticed; the fixup check reads all of main and has no such gap. Main
  # only: a branch dispatched by hand has no receipt yet and may still carry
  # fixups awaiting autosquash.
  trunk-checks:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # >>> review receipt
      - name: Review receipt
        run: |
          ref="refs/reviews/$GITHUB_SHA"
          found=$(git ls-remote origin "$ref" | awk -v ref="$ref" '$2 == ref { print $1 }')
          if [ "$found" = "$GITHUB_SHA" ]; then
            echo "reviewed: $GITHUB_SHA"
          else
            echo "::error::$GITHUB_SHA reached main with no review receipt (refs/reviews/$GITHUB_SHA)."
            echo "Review it, then record the review and push it with the commit:"
            echo '  git update-ref "refs/reviews/$(git rev-parse HEAD)" HEAD'
            echo '  git push --atomic origin HEAD "refs/reviews/$(git rev-parse HEAD)"'
            echo "Then re-run this workflow (workflow_dispatch) to clear the check."
            exit 1
          fi
      # <<< review receipt

      # commit-msg lets fixup!/squash!/amend! through so `git rebase
      # --autosquash` works; one that reaches main was never squashed.
      - name: No unsquashed fixup commits
        run: |
          bad=$(git log --format='%h %s' "$GITHUB_SHA" | grep -E '^[0-9a-f]+ (fixup|squash|amend)!' || true)
          if [ -n "$bad" ]; then
            echo "::error::unsquashed commits reached main:"
            echo "$bad"
            exit 1
          fi

  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake zlib1g-dev libopenblas-dev

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build -j$(nproc)

      # The lint tests run in the lint job, against pinned tools; the runner
      # image's own clang-tidy would report a different set.
      - name: Test
        run: ctest --test-dir build --output-on-failure -LE lint -j$(nproc)

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev libopenblas-dev

      # The same wheels local development uses (pyproject.toml, 22.1.8), not
      # the runner image's clang-tidy, which reports a different check set. A
      # gate that is green locally and red here (or the reverse) is worse than
      # no gate. cmake/Lint.cmake finds them in .venv/bin and checks the
      # version against .clang-format-version / .clang-tidy-version.
      - name: Install the pinned clang tools
        run: |
          set -euxo pipefail
          # pipx ships on the runner image; plain pip refuses (PEP 668).
          pipx run uv sync
          .venv/bin/clang-tidy --version
          .venv/bin/clang-format --version

      # FetchContent clones HiGHS and googletest at CONFIGURE time, and that
      # clone is the slow part of this job. Cache the populated source trees
      # only -- never build/CMakeCache.txt, which pins absolute paths.
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          # No restore-keys on purpose: a fallback would restore a tree from
          # an older GIT_TAG, and FetchContent's in-place update of it is
          # slower and less certain than a clean clone.

      # Configure only. clang-tidy needs compile_commands.json and HiGHS'
      # generated headers, both of which exist after configure -- HConfig.h
      # comes from configure_file and highs_export.h from
      # generate_export_header. Building would cost ~10 min of HiGHS compile
      # for nothing. MCFCG_NATIVE_ARCH=OFF keeps -march=native out of the
      # compile database so the result does not depend on the runner's CPU.
      # MCFCG_REQUIRE_LINT makes a missing or wrong-version tool fatal, so the
      # gate cannot silently register no tests.
      - name: Configure
        run: |
          cmake -B build -G Ninja -DMCFCG_NATIVE_ARCH=OFF -DMCFCG_REQUIRE_LINT=ON

      # This job configures HiGHS-only, so COPT/MOSEK/cuOpt are absent from the
      # compile database and src/lp/{copt,cuopt,mosek}_solver.cpp are NOT
      # linted here, nor by the local pre-push hook, which is HiGHS-only too;
      # lint them by hand with the backend's -DMCFCG_USE_*=ON configured.
      # Pin the count so a silently shrinking source list goes red rather
      # than quietly gating less than it claims to: 22 clang_tidy: tests
      # plus clang_format.
      - name: Assert the expected lint test count
        run: |
          n=$(ctest --test-dir build -N -L lint | grep -cE 'Test +#[0-9]+: (clang_tidy:|clang_format$)')
          echo "lint tests: $n"
          [ "$n" -eq 23 ]

      - name: Lint
        run: ctest --test-dir build --output-on-failure -L lint -j$(nproc)
