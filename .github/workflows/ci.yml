name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  # `push: [main]` is not redundant with `pull_request` here: CLAUDE.md's Git
  # Workflow is trunk-based -- commit straight to main, feature branches
  # optional -- so for most changes there is no PR and pull_request would
  # never fire. Scoping push to main means a feature-branch commit is still
  # covered exactly once, by its PR.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, not `apt-get install clang-tidy`: ubuntu-24.04 ships clang-tidy 18,
  # which disagrees with local development (21) about which checks exist at all
  # -- modernize-use-ranges among them. A gate that is green locally and red in
  # CI (or the reverse) is worse than no gate. Keep equal to
  # MCFCG_CLANG_TOOLS_VERSION (cmake/Lint.cmake).
  LLVM_VERSION: "21"

jobs:
  # What the pre-push hook enforces, re-checked here because a `--no-verify`
  # push or a clone whose hooks never ran skips the hook. Push to main only:
  # a PR has no receipt yet, and its commits may still be autosquashed.
  trunk-checks:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # >>> review receipt
      - name: Review receipt
        run: |
          ref="refs/reviews/$GITHUB_SHA"
          found=$(git ls-remote origin "$ref" | awk -v ref="$ref" '$2 == ref { print $1 }')
          if [ "$found" = "$GITHUB_SHA" ]; then
            echo "reviewed: $GITHUB_SHA"
          else
            echo "::error::$GITHUB_SHA reached main with no review receipt (refs/reviews/$GITHUB_SHA)."
            echo "Review it, then record the review and push it with the commit:"
            echo '  git update-ref "refs/reviews/$(git rev-parse HEAD)" HEAD'
            echo '  git push --atomic origin HEAD "refs/reviews/$(git rev-parse HEAD)"'
            echo "A receipt pushed on its own starts no run: re-run this job once it is pushed."
            exit 1
          fi
      # <<< review receipt

      # commit-msg lets fixup!/squash!/amend! through so `git rebase
      # --autosquash` works; one that reaches main was never squashed.
      - name: No unsquashed fixup commits
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
              || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$GITHUB_SHA"   # new branch or rewritten history: check all of it
          else
            range="$BEFORE..$GITHUB_SHA"
          fi
          bad=$(git log --format='%h %s' "$range" | grep -E '^[0-9a-f]+ (fixup|squash|amend)!' || true)
          if [ -n "$bad" ]; then
            echo "::error::unsquashed commits reached main:"
            echo "$bad"
            exit 1
          fi

  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake zlib1g-dev libopenblas-dev

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build -j$(nproc)

      # The lint tests run in the lint job, against pinned tools; the runner
      # image's own clang-tidy would report a different set.
      - name: Test
        run: ctest --test-dir build --output-on-failure -LE lint -j$(nproc)

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev libopenblas-dev

      - name: Install clang-tidy ${{ env.LLVM_VERSION }}
        run: |
          set -euxo pipefail
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y "clang-tidy-${LLVM_VERSION}" "clang-format-${LLVM_VERSION}"
          "clang-tidy-${LLVM_VERSION}" --version
          "clang-format-${LLVM_VERSION}" --version

      # FetchContent clones HiGHS and googletest at CONFIGURE time, and that
      # clone is the slow part of this job. Cache the populated source trees
      # only -- never build/CMakeCache.txt, which pins absolute paths. The
      # HiGHS PATCH_COMMAND is idempotent, so restoring an already-patched
      # highs-src is safe.
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/patches/*.patch') }}
          # No restore-keys on purpose. A fallback would restore a tree
          # populated at the same GIT_TAG, and FetchContent then skips the
          # download AND the PATCH_COMMAND -- so an edited
          # cmake/patches/*.patch would never be applied, silently defeating
          # the patch hash this key exists to track.

      # Configure only. clang-tidy needs compile_commands.json and HiGHS'
      # generated headers, both of which exist after configure -- HConfig.h
      # comes from configure_file and highs_export.h from
      # generate_export_header. Building would cost ~10 min of HiGHS compile
      # for nothing. MCFCG_NATIVE_ARCH=OFF keeps -march=native out of the
      # compile database so the result does not depend on the runner's CPU.
      # MCFCG_REQUIRE_LINT makes a missing or wrong-version tool fatal, so the
      # gate cannot silently register no tests.
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DMCFCG_NATIVE_ARCH=OFF -DMCFCG_REQUIRE_LINT=ON \
            -DCLANG_TIDY_EXE=/usr/bin/clang-tidy-${LLVM_VERSION} \
            -DCLANG_FORMAT_EXE=/usr/bin/clang-format-${LLVM_VERSION}

      # This job configures HiGHS-only, so COPT/MOSEK/cuOpt are absent from the
      # compile database and src/lp/{copt,cuopt,mosek}_solver.cpp are NOT
      # linted here, nor by the local pre-push hook, which is HiGHS-only too;
      # lint them by hand with the backend's -DMCFCG_USE_*=ON configured.
      # Pin the count so a silently shrinking source list goes red rather
      # than quietly gating less than it claims to: 22 clang_tidy: tests
      # plus clang_format.
      - name: Assert the expected lint test count
        run: |
          n=$(ctest --test-dir build -N -L lint | grep -cE 'Test +#[0-9]+: (clang_tidy:|clang_format$)')
          echo "lint tests: $n"
          [ "$n" -eq 23 ]

      - name: Lint
        run: ctest --test-dir build --output-on-failure -L lint -j$(nproc)
